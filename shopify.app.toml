# CreditLoop — Shopify app configuration
#
# Verify `api_version` and every scope against the current stable Shopify API
# release before deploying. See README → "Shopify API version".

name = "CreditLoop"
handle = "creditloop_app"
client_id = "48689ca489ce286c6742daabe21c0f2e"
application_url = "https://credit-loop-drab.vercel.app"
embedded = true

[access_scopes]
# Minimum scopes for the implemented features. Each is justified in docs/scopes.md
# and shown to the merchant in Settings → General.
scopes = "read_orders,write_orders,read_returns,read_customers,read_store_credit_accounts,write_store_credit_account_transactions"

[auth]
redirect_urls = [
  "https://credit-loop-drab.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  # Mandatory compliance endpoints for App Store distribution. These are
  # declared as privacy_compliance URLs, not as webhook topic subscriptions.
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://credit-loop-drab.vercel.app/api/webhooks/customers-data-request"
  customer_deletion_url = "https://credit-loop-drab.vercel.app/api/webhooks/customers-redact"
  shop_deletion_url = "https://credit-loop-drab.vercel.app/api/webhooks/shop-redact"

  # Only app/uninstalled is declared here. The orders/*, refunds/create and
  # customers/* topics carry protected customer data, and Shopify refuses to
  # create an app version that declares them until the app is approved for it
  # (Partner dashboard -> App setup -> Protected customer data access).
  #
  # CreditLoop registers those topics at runtime instead, from the OAuth
  # callback and the onboarding sync (lib/shopify/webhooks.js), so the app is
  # fully functional once approval is granted — with no redeploy needed.
  #
  # After approval you may move them back here if you prefer declarative
  # webhooks; the runtime registration is idempotent and will skip any topic
  # Shopify already has registered.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/webhooks/app-uninstalled"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
