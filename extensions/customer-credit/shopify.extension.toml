# Customer Account UI extension — "Your store credit"
#
# Targets and component set verified against @shopify/ui-extensions 2026-07.
# Customer account extensions require the new customer accounts experience.

api_version = "2026-07"

[[extensions]]
type = "ui_extension"
name = "Store credit"
handle = "customer-credit"

  [[extensions.targeting]]
  # Full credit history page in the customer account.
  target = "customer-account.page.render"
  module = "./src/CreditPage.jsx"

  [[extensions.targeting]]
  # Compact balance card on the order index.
  target = "customer-account.order-index.block.render"
  module = "./src/CreditBlock.jsx"

  [extensions.capabilities]
  # Required to read the balance from the CreditLoop backend. The extension does
  # not query the Customer Account API directly, so `api_access` is not requested.
  network_access = true
