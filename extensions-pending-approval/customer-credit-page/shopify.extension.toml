# Customer Account UI extension — full store credit history page.
#
# `customer-account.page.render` must be the only target in its extension, which
# is why this is separate from extensions/customer-credit.

api_version = "2026-07"

[[extensions]]
type = "ui_extension"
name = "Store credit history"
handle = "customer-credit-page"

uid = "fd8aaddd-79c8-59f3-f2f9-80c7b391eb46457ba60c"

  [[extensions.targeting]]
  target = "customer-account.page.render"
  module = "./src/CreditPage.jsx"

  [extensions.capabilities]
  network_access = true
