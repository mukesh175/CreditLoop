# Customer Account UI extension — store credit card on the order index.
#
# `customer-account.page.render` cannot share an extension with any other
# target, so the full credit-history page lives in its own extension:
# extensions/customer-credit-page.

api_version = "2026-07"

[[extensions]]
type = "ui_extension"
name = "Store credit"
handle = "customer-credit"

uid = "ef984ef4-9781-6f71-a6ac-bce8db604870b3b1d178"

  [[extensions.targeting]]
  target = "customer-account.order-index.block.render"
  module = "./src/CreditBlock.jsx"

  [extensions.capabilities]
  # Required to read the balance from the CreditLoop backend. The extension does
  # not query the Customer Account API directly, so `api_access` is not requested.
  network_access = true
