# CreditLoop — Shopify app configuration
#
# Verify `api_version` and every scope against the current stable Shopify API
# release before deploying. See README → "Shopify API version".

name = "CreditLoop"
handle = "creditloop"
client_id = "48689ca489ce286c6742daabe21c0f2e"
application_url = "https://credit-loop-xi.vercel.app"
embedded = true

[access_scopes]
# Minimum scopes for the implemented features. Each is justified in docs/scopes.md
# and shown to the merchant in Settings → General.
scopes = "read_orders,write_orders,read_returns,read_customers,read_store_credit_accounts,write_store_credit_account_transactions"

[auth]
redirect_urls = [
  "https://credit-loop-xi.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  # Mandatory compliance endpoints for App Store distribution. These are
  # declared as privacy_compliance URLs, not as webhook topic subscriptions.
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://credit-loop-xi.vercel.app/api/webhooks/customers-data-request"
  customer_deletion_url = "https://credit-loop-xi.vercel.app/api/webhooks/customers-redact"
  shop_deletion_url = "https://credit-loop-xi.vercel.app/api/webhooks/shop-redact"

  # Application topics. The orders/* and customers/* topics carry protected
  # customer data and require approval in the Partner dashboard before a
  # version can be released (App setup -> Protected customer data access).
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/webhooks/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/api/webhooks/orders-create"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/api/webhooks/orders-updated"

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "/api/webhooks/refunds-create"

  [[webhooks.subscriptions]]
  topics = [ "customers/create" ]
  uri = "/api/webhooks/customers-create"

  [[webhooks.subscriptions]]
  topics = [ "customers/update" ]
  uri = "/api/webhooks/customers-update"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true
